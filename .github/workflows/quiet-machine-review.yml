name: Quiet Machine Android checks

on:
  push:
    branches: [fix/quiet-machine-2-review]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: launcher/**/*.gradle*
      - uses: android-actions/setup-android@v3
      - name: Install Android 34 SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Test, lint and assemble
        run: |
          chmod +x launcher/gradlew
          cd launcher
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease assembleDebug
      - name: Check release APK size
        run: |
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          size=$(wc -c < "$apk")
          echo "Release APK size: $size B (limit 589824 B)"
          test "$size" -le 589824
